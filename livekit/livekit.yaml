# Self-hosted LiveKit for local development. API keys come from the LIVEKIT_KEYS env var.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50060
  # node_ip is passed on the command line (LIVEKIT_NODE_IP); no STUN lookup for local use.
  use_external_ip: false
room:
  empty_timeout: 300
  max_participants: 8
logging:
  level: info
  json: true
